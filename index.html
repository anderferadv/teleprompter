<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<meta name="theme-color" content="#0b0d10">
<title>Teleprompter</title>
<style>
:root{
  --bg:#0b0d10; --panel:#161a20; --line:#262c35; --fg:#f2f4f7; --mute:#8b94a1;
  --accent:#ffb020; --rec:#ff3b30;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* editor */
#editor{padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px)}
#editor h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
#editor p.sub{margin:0 0 14px;color:var(--mute);font-size:14px}
#script{flex:1;min-height:0;width:100%;resize:none;background:var(--panel);color:var(--fg);
  border:1px solid var(--line);border-radius:12px;padding:14px;font:18px/1.5 inherit;outline:none}
#script:focus{border-color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row label{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px}
.primary{flex:1;background:var(--accent);color:#1a1200;font-weight:700;padding:15px 18px;border-radius:12px;font-size:17px}
.chip{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px}
.chip.on{border-color:var(--accent);color:var(--accent)}
#err{color:#ff8a80;font-size:14px;margin-top:8px;min-height:1em}

/* stage */
#stage{background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#cam.mirror{transform:scaleX(-1)}
#veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.72) 0,rgba(0,0,0,.72) var(--band,55%),rgba(0,0,0,0) calc(var(--band,55%) + 14%))}
#view{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 54px);height:var(--viewh,50%);overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%)}
#text{padding:0 22px;font-weight:700;line-height:1.35;white-space:pre-wrap;text-align:center;
  text-shadow:0 1px 6px rgba(0,0,0,.9);will-change:transform}
#text.flip{transform-origin:center}
#readline{position:absolute;left:0;right:0;height:0;border-top:2px solid rgba(255,176,32,.55);pointer-events:none}
.tri{position:absolute;left:4px;width:0;height:0;border:8px solid transparent;border-left-color:var(--accent);margin-top:-8px}
#top{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 14px 8px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.pill{background:rgba(20,22,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:999px;padding:9px 14px;font-size:14px;font-variant-numeric:tabular-nums}
#timer{display:flex;gap:8px;align-items:center}
#dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.recording #dot{background:var(--rec);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(var(--safe-b) + 12px);z-index:5;
  display:flex;flex-direction:column;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.65),transparent)}
.sliders{display:flex;gap:14px}
.sliders label{flex:1;display:flex;flex-direction:column;gap:2px;font-size:12px;color:#d6dbe2}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.round{width:46px;height:46px;border-radius:50%;background:rgba(20,22,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:18px}
.round.on{color:var(--accent)}
#rec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
#rec i{width:54px;height:54px;border-radius:50%;background:var(--rec);transition:.15s}
.recording #rec i{width:28px;height:28px;border-radius:8px}
#play{min-width:96px;background:var(--accent);color:#1a1200;font-weight:700;padding:13px 18px;border-radius:999px}
#count{position:absolute;inset:0;display:none;place-items:center;font-size:120px;font-weight:800;z-index:9;
  background:rgba(0,0,0,.45);text-shadow:0 4px 20px #000}
#count.on{display:grid}

/* result */
#result{background:var(--bg);padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);gap:12px}
#result video{flex:1;min-height:0;width:100%;border-radius:12px;background:#000;object-fit:contain}
.hint{color:var(--mute);font-size:13px}
@media (prefers-reduced-motion:reduce){.recording #dot{animation:none}}
</style>
</head>
<body>

<section id="editor" class="screen on">
  <h1>Teleprompter</h1>
  <p class="sub">Cole o roteiro, ajuste e grave olhando para a lente.</p>
  <textarea id="script" placeholder="Cole ou digite seu roteiro aqui…" spellcheck="false"></textarea>
  <div class="row">
    <button class="chip" id="optFront">Câmera frontal</button>
    <button class="chip" id="optMirrorText">Espelhar texto</button>
    <button class="chip on" id="optRecord">Gravar vídeo</button>
  </div>
  <div id="err"></div>
  <div class="row"><button class="primary" id="start">Abrir câmera e começar</button></div>
</section>

<section id="stage" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div id="veil"></div>
  <div id="view"><div id="text"></div></div>
  <div id="readline"><span class="tri"></span></div>
  <div id="top">
    <button class="pill" id="back">‹ Roteiro</button>
    <div class="pill" id="timer"><span id="dot"></span><span id="time">00:00</span></div>
  </div>
  <div id="bar">
    <div class="sliders">
      <label>Velocidade <input type="range" id="speed" min="1" max="40" value="12"></label>
      <label>Tamanho <input type="range" id="size" min="22" max="64" value="34"></label>
    </div>
    <div class="ctrl">
      <button class="round" id="restart" aria-label="Voltar ao início">⟲</button>
      <button id="play">Rolar</button>
      <button id="rec" aria-label="Gravar"><i></i></button>
      <button class="round" id="flipCam" aria-label="Trocar câmera">⇄</button>
    </div>
  </div>
  <div id="count"></div>
</section>

<section id="result" class="screen">
  <video id="out" controls playsinline></video>
  <div class="row" style="margin:0">
    <button class="primary" id="save">Salvar / Compartilhar</button>
    <button class="chip" id="again">Gravar de novo</button>
  </div>
  <div class="hint" id="saveHint">Na janela que abrir, escolha “Salvar Vídeo” para guardar no Rolo da Câmera.</div>
</section>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var store = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };

  var script=$('script'), errEl=$('err');
  var st={front:store.get('front','1')==='1', flipText:store.get('flipText','0')==='1', record:store.get('record','1')==='1'};
  script.value = store.get('script',
    'Olá! Este é o seu teleprompter.\n\nCole aqui o seu roteiro e toque em “Abrir câmera e começar”.\n\nO texto rola na velocidade que você escolher, enquanto a câmera grava o vídeo.\n\nMantenha o olhar perto da lente e fale com naturalidade.');
  script.addEventListener('input',function(){store.set('script',script.value)});

  function paintChips(){
    $('optFront').classList.toggle('on',st.front);
    $('optFront').textContent = st.front ? 'Câmera frontal' : 'Câmera traseira';
    $('optMirrorText').classList.toggle('on',st.flipText);
    $('optRecord').classList.toggle('on',st.record);
    $('optRecord').textContent = st.record ? 'Gravar vídeo' : 'Só prévia';
  }
  $('optFront').onclick=function(){st.front=!st.front;store.set('front',st.front?'1':'0');paintChips()};
  $('optMirrorText').onclick=function(){st.flipText=!st.flipText;store.set('flipText',st.flipText?'1':'0');paintChips()};
  $('optRecord').onclick=function(){st.record=!st.record;store.set('record',st.record?'1':'0');paintChips()};
  paintChips();

  function show(id){['editor','stage','result'].forEach(function(s){$(s).classList.toggle('on',s===id)})}

  /* ---------- camera ---------- */
  var stream=null, cam=$('cam');
  function stopStream(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
  function openCamera(){
    stopStream();
    var constraints={
      video:{facingMode:st.front?'user':'environment',width:{ideal:1920},height:{ideal:1080}},
      audio:{echoCancellation:true,noiseSuppression:true}
    };
    if(!st.record) constraints.audio=false;
    return navigator.mediaDevices.getUserMedia(constraints).then(function(s){
      stream=s; cam.srcObject=s; cam.classList.toggle('mirror',st.front);
      return cam.play().catch(function(){});
    });
  }

  /* ---------- scrolling text ---------- */
  var view=$('view'), text=$('text');
  var pos=0, playing=false, last=0, raf=0;
  function metrics(){
    var h=view.clientHeight;
    text.style.paddingTop=(h*0.18)+'px';
    text.style.paddingBottom=h+'px';
    $('readline').style.top=(view.offsetTop + h*0.18)+'px';
    $('veil').style.setProperty('--band',(view.offsetTop+h)/window.innerHeight*100+'%');
  }
  function applySize(){
    text.style.fontSize=$('size').value+'px';
    store.set('size',$('size').value);
  }
  function render(){text.style.transform='translateY('+(-pos)+'px)'+(st.flipText?' scaleX(-1)':'')}
  function maxPos(){return Math.max(0,text.scrollHeight-view.clientHeight)}
  function tick(t){
    if(!playing) return;
    var dt=Math.min(.05,(t-last)/1000); last=t;
    pos+= $('speed').value*5*dt*(parseInt($('size').value,10)/34);
    if(pos>=maxPos()){pos=maxPos();setPlaying(false)}
    render(); raf=requestAnimationFrame(tick);
  }
  function setPlaying(p){
    playing=p; $('play').textContent=p?'Pausar':'Rolar';
    cancelAnimationFrame(raf);
    if(p){last=performance.now();raf=requestAnimationFrame(tick)}
  }
  $('play').onclick=function(){setPlaying(!playing)};
  $('restart').onclick=function(){setPlaying(false);pos=0;render()};
  $('size').oninput=function(){applySize();metrics();render()};
  $('speed').oninput=function(){store.set('speed',$('speed').value)};
  $('speed').value=store.get('speed','12'); $('size').value=store.get('size','34');
  view.addEventListener('click',function(){setPlaying(!playing)});

  // arrastar o texto com o dedo
  var drag=null;
  view.addEventListener('touchstart',function(e){drag={y:e.touches[0].clientY,p:pos,moved:false}},{passive:true});
  view.addEventListener('touchmove',function(e){
    if(!drag) return; var dy=drag.y-e.touches[0].clientY;
    if(Math.abs(dy)>6) drag.moved=true;
    if(drag.moved){pos=Math.min(maxPos(),Math.max(0,drag.p+dy));render()}
  },{passive:true});
  view.addEventListener('touchend',function(e){if(drag&&drag.moved){e.preventDefault&&e.cancelable&&e.preventDefault()}drag=null});

  /* ---------- wake lock ---------- */
  var wl=null;
  function lockScreen(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}}catch(e){}}
  function unlockScreen(){try{if(wl){wl.release();wl=null}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&$('stage').classList.contains('on'))lockScreen()});

  /* ---------- recording ---------- */
  var mr=null, chunks=[], recStart=0, timerId=0, blob=null, mime='';
  function pickMime(){
    var c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    if(!window.MediaRecorder) return null;
    for(var i=0;i<c.length;i++){try{if(MediaRecorder.isTypeSupported(c[i])) return c[i]}catch(e){}}
    return '';
  }
  function fmt(s){var m=Math.floor(s/60),r=Math.floor(s%60);return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
  function startTimer(){recStart=Date.now();$('time').textContent='00:00';timerId=setInterval(function(){$('time').textContent=fmt((Date.now()-recStart)/1000)},250)}
  function stopTimer(){clearInterval(timerId)}

  function startRecording(){
    var m=pickMime();
    if(m===null){errNote('Este navegador não grava vídeo. Atualize o iOS (14.3 ou mais).');return}
    chunks=[]; mime=m;
    try{mr=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream)}catch(e){errNote('Não foi possível iniciar a gravação.');return}
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){
      blob=new Blob(chunks,{type:mr.mimeType||mime||'video/mp4'});
      var url=URL.createObjectURL(blob); var o=$('out'); o.src=url; show('result');
    };
    mr.start(1000);
    $('stage').classList.add('recording'); startTimer();
  }
  function stopRecording(){
    if(mr&&mr.state!=='inactive') mr.stop();
    $('stage').classList.remove('recording'); stopTimer(); setPlaying(false);
  }
  function errNote(msg){$('time').textContent=msg;setTimeout(function(){$('time').textContent='00:00'},3500)}

  function countdown(n,done){
    var c=$('count'); c.classList.add('on'); c.textContent=n;
    var t=setInterval(function(){n--; if(n<=0){clearInterval(t);c.classList.remove('on');done()} else c.textContent=n},1000);
  }
  $('rec').onclick=function(){
    if(!st.record){setPlaying(!playing);return}
    if(mr&&mr.state==='recording'){stopRecording();return}
    pos=0;render();
    countdown(3,function(){startRecording();setPlaying(true)});
  };

  $('flipCam').onclick=function(){
    if(mr&&mr.state==='recording') return;
    st.front=!st.front; store.set('front',st.front?'1':'0'); paintChips();
    openCamera().catch(function(){});
  };

  /* ---------- navigation ---------- */
  $('start').onclick=function(){
    errEl.textContent='';
    var s=script.value.trim();
    if(!s){errEl.textContent='Escreva ou cole um roteiro primeiro.';return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      errEl.textContent='A câmera só funciona em página segura (https). Abra o endereço https do app no Safari.';return}
    text.textContent=s;
    openCamera().then(function(){
      show('stage'); lockScreen(); applySize(); metrics(); pos=0; render(); setPlaying(false);
    }).catch(function(e){
      errEl.textContent = (e&&e.name==='NotAllowedError')
        ? 'Permissão negada. Em Ajustes > Safari > Câmera e Microfone, permita este site.'
        : 'Não foi possível abrir a câmera ('+(e&&e.name||'erro')+').';
    });
  };
  $('back').onclick=function(){
    if(mr&&mr.state==='recording'){mr.onstop=null;mr.stop();$('stage').classList.remove('recording');stopTimer()}
    setPlaying(false); stopStream(); unlockScreen(); show('editor');
  };
  $('again').onclick=function(){
    $('out').removeAttribute('src');
    openCamera().then(function(){show('stage');lockScreen();pos=0;render();metrics()}).catch(function(){show('editor')});
  };
  window.addEventListener('resize',function(){metrics();render()});
  window.addEventListener('orientationchange',function(){setTimeout(function(){metrics();render()},300)});

  /* ---------- save ---------- */
  $('save').onclick=function(){
    if(!blob) return;
    var ext=(blob.type.indexOf('mp4')>-1)?'mp4':'webm';
    var file=new File([blob],'teleprompter-'+Date.now()+'.'+ext,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).catch(function(){});
    } else {
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name;
      document.body.appendChild(a); a.click(); a.remove();
      $('saveHint').textContent='Se o download não iniciar, toque e segure o vídeo acima para salvar.';
    }
  };
})();
</script>
</body>
</html>
